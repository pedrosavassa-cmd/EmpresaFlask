<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de empresa</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #2c3e50; color: #fff; padding: 20px; text-align: center; }
        .header-content { display: flex; justify: space-between; align-items: center; max-width: 1000px; margin: 0 auto; }
        .header-content a { color: #3498db; text-decoration: none; font-weight: bold; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card h2 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        
        .form-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .input-box { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        .input-box label { font-size: 14px; margin-bottom: 5px; color: #555; font-weight: 600; }
        .input-box input, .input-box select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .input-box input:focus { border-color: #3498db; }
        
        .btn-container { display: flex; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; transition: 0.2s; }
        .btn-primary { background-color: #3498db; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #7f8c8d; }
        .btn-secondary:hover { background-color: #95a5a6; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        .badge-active { background-color: #d4edda; color: #155724; }
        .badge-inactive { background-color: #f8d7da; color: #721c24; }
        
        .action-btn { padding: 6px 12px; border-radius: 4px; font-size: 12px; margin-right: 5px; }
        .btn-edit { background-color: #f39c12; }
        .btn-edit:hover { background-color: #d35400; }
        .btn-delete { background-color: #e74c3c; }
        .btn-delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Módulo de empresa</h1>
            <a href="/sistema">← Voltar ao Menu</a>
        </div>
    </header>

    <div class="container">
        <!-- FORMULÁRIO DE CADASTRO E EDIÇÃO -->
        <div class="card">
            <h2 id="form-title">Cadastrar Empresa</h2>
            <form id="form-empresa">
                <input type="hidden" id="empresa-id">
                
                <div class="form-group">
                    <div class="input-box">
                        <label for="nome">Nome da Empresa*</label>
                        <input type="text" id="nome" required placeholder="Ex: Cloude Tecnologias">
                    </div>
                    <div class="input-box">
                        <label for="cnpj">CNPJ</label>
                        <input type="text" id="cnpj" placeholder="00.000.000/0000-00">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" placeholder="Ex: Votorantim">
                    </div>
                    <div class="input-box">
                        <label for="ativo">Status</label>
                        <select id="ativo">
                            <option value="1">Ativo</option>
                            <option value="0">Inativo</option>
                        </select>
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-primary" id="btn-salvar">Salvar Empresa</button>
                    <button type="button" class="btn-secondary" id="btn-cancelar" onclick="limparFormulario()" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- LISTAGEM DE empresa -->
        <div class="card">
            <h2>Empresas Cadastradas</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>CNPJ</th>
                        <th>Cidade</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-empresa">
                    <!-- Linhas inseridas via JS JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/empresa';

        document.addEventListener('DOMContentLoaded', () => {
            carregarempresa();

            document.getElementById('form-empresa').addEventListener('submit', async (e) => {
                e.preventDefault();
                await salvarEmpresa();
            });
        });

        // READ: Carregar lista na tabela
        async function carregarempresa() {
            try {
                const response = await fetch(API_URL);
                const empresa = await response.json();
                
                const tbody = document.getElementById('tabela-empresa');
                tbody.innerHTML = '';

                empresa.forEach(empresa => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${empresa.id}</td>
                        <td>${empresa.nome}</td>
                        <td>${empresa.cnpj || '-'}</td>
                        <td>${empresa.cidade || '-'}</td>
                        <td>
                            <span class="badge ${empresa.ativo ? 'badge-active' : 'badge-inactive'}">
                                ${empresa.ativo ? 'Ativo' : 'Inativo'}
                            </span>
                        </td>
                        <td>
                            <button class="action-btn btn-edit" onclick="prepararEdicao(${empresa.id})">Editar</button>
                            <button class="action-btn btn-delete" onclick="deletarEmpresa(${empresa.id})">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (erro) {
                console.error('Erro ao carregar empresa:', erro);
                alert('Erro ao carregar lista de empresa.');
            }
        }

        // CREATE / UPDATE: Salvar formulário
        async function salvarEmpresa() {
            const id = document.getElementById('empresa-id').value;
            const nome = document.getElementById('nome').value;
            const cnpj = document.getElementById('cnpj').value;
            const cidade = document.getElementById('cidade').value;
            const ativo = parseInt(document.getElementById('ativo').value);

            const dados = { nome, cnpj, cidade, ativo };
            const metodo = id ? 'PUT' : 'POST';
            const url = id ? `${API_URL}/${id}` : API_URL;

            try {
                const response = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (response.ok) {
                    alert(resultado.mensagem);
                    limparFormulario();
                    carregarempresa();
                } else {
                    alert(resultado.erro || 'Erro ao processar solicitação.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Falha na comunicação com o servidor.');
            }
        }

        // PREPARAR EDIÇÃO: Preenche os campos do formulário com os dados existentes
        async function prepararEdicao(id) {
            try {
                const response = await fetch(`${API_URL}/${id}`);
                if (!response.ok) throw new Error('Empresa não encontrada');
                
                const empresa = await response.json();

                document.getElementById('empresa-id').value = empresa.id;
                document.getElementById('nome').value = empresa.nome;
                document.getElementById('cnpj').value = empresa.cnpj || '';
                document.getElementById('cidade').value = empresa.cidade || '';
                document.getElementById('ativo').value = empresa.ativo;

                document.getElementById('form-title').innerText = 'Editar Empresa';
                document.getElementById('btn-salvar').innerText = 'Atualizar';
                document.getElementById('btn-cancelar').style.display = 'inline-block';
            } catch (erro) {
                console.error(erro);
                alert('Erro ao buscar dados da empresa.');
            }
        }

        // DELETE: Remover registro
        async function deletarEmpresa(id) {
            if (!confirm(`Tem certeza que deseja excluir a empresa ID ${id}?`)) return;

            try {
                const response = await fetch(`${API_URL}/${id}`, {
                    method: 'DELETE'
                });

                const resultado = await response.json();

                if (response.ok) {
                    alert(resultado.mensagem);
                    carregarempresa();
                } else {
                    alert(resultado.erro);
                }
            } catch (erro) {
                console.error('Erro ao deletar:', erro);
                alert('Erro ao excluir empresa.');
            }
        }

        // RESET: Limpa os inputs
        function limparFormulario() {
            document.getElementById('empresa-id').value = '';
            document.getElementById('form-empresa').reset();
            document.getElementById('form-title').innerText = 'Cadastrar Empresa';
            document.getElementById('btn-salvar').innerText = 'Salvar Empresa';
            document.getElementById('btn-cancelar').style.display = 'none';
        }
    </script>
</body>
</html>
