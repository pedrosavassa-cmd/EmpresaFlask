<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Funcionários</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f4f6f9; color: #333; }
        header { background-color: #2c3e50; color: #fff; padding: 20px; text-align: center; }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 1000px; margin: 0 auto; }
        .header-content a { color: #3498db; text-decoration: none; font-weight: bold; }
        .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
        
        .card { background: #fff; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 25px; }
        .card h2 { margin-bottom: 15px; color: #2c3e50; border-bottom: 2px solid #ecf0f1; padding-bottom: 10px; }
        
        .form-group { display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 15px; }
        .input-box { flex: 1; min-width: 200px; display: flex; flex-direction: column; }
        .input-box label { font-size: 14px; margin-bottom: 5px; color: #555; font-weight: 600; }
        .input-box input, .input-box select { padding: 10px; border: 1px solid #ccc; border-radius: 5px; outline: none; font-size: 14px; }
        .input-box input:focus { border-color: #3498db; }
        
        .btn-container { display: flex; gap: 10px; }
        button { padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; color: #fff; transition: 0.2s; }
        .btn-primary { background-color: #3498db; }
        .btn-primary:hover { background-color: #2980b9; }
        .btn-secondary { background-color: #7f8c8d; }
        .btn-secondary:hover { background-color: #95a5a6; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #f8f9fa; color: #2c3e50; }
        
        .action-btn { padding: 6px 12px; border-radius: 4px; font-size: 12px; margin-right: 5px; }
        .btn-edit { background-color: #f39c12; }
        .btn-edit:hover { background-color: #d35400; }
        .btn-delete { background-color: #e74c3c; }
        .btn-delete:hover { background-color: #c0392b; }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <h1>Módulo de Funcionários</h1>
            <a href="/sistema">← Voltar ao Menu</a>
        </div>
    </header>

    <div class="container">
        <!-- FORMULÁRIO DE CADASTRO E EDIÇÃO -->
        <div class="card">
            <h2 id="form-title">Cadastrar Funcionário</h2>
            <form id="form-funcionario">
                <input type="hidden" id="funcionario-id">
                
                <div class="form-group">
                    <div class="input-box">
                        <label for="nome">Nome Completo*</label>
                        <input type="text" id="nome" required placeholder="Ex: Maria Eduarda">
                    </div>
                    <div class="input-box">
                        <label for="cargo">Cargo*</label>
                        <input type="text" id="cargo" required placeholder="Ex: Escriturária">
                    </div>
                </div>

                <div class="form-group">
                    <div class="input-box">
                        <label for="salario">Salário (R$)*</label>
                        <input type="number" step="0.01" id="salario" required placeholder="Ex: 1200.36">
                    </div>
                    <div class="input-box">
                        <label for="id_empresa">Empresa*</label>
                        <select id="id_empresa" required>
                            <option value="">Selecione uma empresa...</option>
                        </select>
                    </div>
                </div>

                <div class="btn-container">
                    <button type="submit" class="btn-primary" id="btn-salvar">Salvar Funcionário</button>
                    <button type="button" class="btn-secondary" id="btn-cancelar" onclick="limparFormulario()" style="display: none;">Cancelar</button>
                </div>
            </form>
        </div>

        <!-- LISTAGEM DE FUNCIONÁRIOS -->
        <div class="card">
            <h2>Funcionários Cadastrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nome</th>
                        <th>Cargo</th>
                        <th>Salário</th>
                        <th>Empresa</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabela-funcionario">
                    <!-- Inserido dinamicamente via JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_funcionario = '/api/funcionario';
        const API_empresa = '/api/empresa';

        document.addEventListener('DOMContentLoaded', async () => {
            // Garante que o combo seja populado ANTES de qualquer ação do usuário
            await carregarempresaNoSelect();
            carregarfuncionario();

            document.getElementById('form-funcionario').addEventListener('submit', async (e) => {
                e.preventDefault();
                await salvarFuncionario();
            });
        });

        // Preenche a caixa de seleção e retorna a Promise finalizada
        async function carregarempresaNoSelect() {
            try {
                const response = await fetch(API_empresa);
                const empresa = await response.json();
                
                const select = document.getElementById('id_empresa');
                select.innerHTML = '<option value="">Selecione uma empresa...</option>';

                empresa.forEach(empresa => {
                    const option = document.createElement('option');
                    option.value = empresa.id;
                    option.textContent = empresa.nome + (empresa.ativo ? '' : ' (Inativa)');
                    select.appendChild(option);
                });
            } catch (erro) {
                console.error('Erro ao carregar opções de empresa:', erro);
            }
        }

        // READ: Listar funcionários
        async function carregarfuncionario() {
            try {
                const response = await fetch(API_funcionario);
                const funcionario = await response.json();
                
                const tbody = document.getElementById('tabela-funcionario');
                tbody.innerHTML = '';

                funcionario.forEach(func => {
                    const salarioFormatado = parseFloat(func.salario).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${func.id}</td>
                        <td>${func.nome}</td>
                        <td>${func.cargo}</td>
                        <td>${salarioFormatado}</td>
                        <td>${func.empresa_nome}</td>
                        <td>
                            <button class="action-btn btn-edit" onclick="prepararEdicao(${func.id})">Editar</button>
                            <button class="action-btn btn-delete" onclick="deletarFuncionario(${func.id})">Excluir</button>
                        </td>
                    `;
                    tbody.appendChild(tr);
                });
            } catch (erro) {
                console.error('Erro ao carregar funcionários:', erro);
            }
        }

        // PREPARAR EDIÇÃO COM GARANTIA DE PREENCHIMENTO DO COMBO
        async function prepararEdicao(id) {
            try {
                // Recarrega o select caso empresa tenham sido adicionadas recentemente
                await carregarempresaNoSelect();

                const response = await fetch(`${API_funcionario}/${id}`);
                if (!response.ok) throw new Error('Funcionário não encontrado');
                
                const func = await response.json();

                document.getElementById('funcionario-id').value = func.id;
                document.getElementById('nome').value = func.nome;
                document.getElementById('cargo').value = func.cargo;
                document.getElementById('salario').value = func.salario;
                
                // Define o valor convertido explicitamente para string
                document.getElementById('id_empresa').value = String(func.id_empresa);

                document.getElementById('form-title').innerText = 'Editar Funcionário';
                document.getElementById('btn-salvar').innerText = 'Atualizar';
                document.getElementById('btn-cancelar').style.display = 'inline-block';
            } catch (erro) {
                console.error(erro);
                alert('Erro ao buscar dados do funcionário.');
            }
        }

        // CREATE / UPDATE: Salvar
        async function salvarFuncionario() {
            const id = document.getElementById('funcionario-id').value;
            const nome = document.getElementById('nome').value;
            const cargo = document.getElementById('cargo').value;
            const salario = parseFloat(document.getElementById('salario').value);
            const id_empresa = parseInt(document.getElementById('id_empresa').value);

            const dados = { nome, cargo, salario, id_empresa };
            const metodo = id ? 'PUT' : 'POST';
            const url = id ? `${API_funcionario}/${id}` : API_funcionario;

            try {
                const response = await fetch(url, {
                    method: metodo,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(dados)
                });

                const resultado = await response.json();

                if (response.ok) {
                    alert(resultado.mensagem);
                    limparFormulario();
                    carregarfuncionario();
                } else {
                    alert(resultado.erro || 'Erro ao salvar funcionário.');
                }
            } catch (erro) {
                console.error('Erro:', erro);
                alert('Falha na comunicação com o servidor.');
            }
        }

        // DELETE: Remover registro
        async function deletarFuncionario(id) {
            if (!confirm(`Tem certeza que deseja excluir o funcionário ID ${id}?`)) return;

            try {
                const response = await fetch(`${API_funcionario}/${id}`, { method: 'DELETE' });
                const resultado = await response.json();

                if (response.ok) {
                    alert(resultado.mensagem);
                    carregarfuncionario();
                } else {
                    alert(resultado.erro);
                }
            } catch (erro) {
                console.error('Erro ao deletar:', erro);
            }
        }

        // RESET: Limpa os inputs
        function limparFormulario() {
            document.getElementById('funcionario-id').value = '';
            document.getElementById('form-funcionario').reset();
            document.getElementById('form-title').innerText = 'Cadastrar Funcionário';
            document.getElementById('btn-salvar').innerText = 'Salvar Funcionário';
            document.getElementById('btn-cancelar').style.display = 'none';
        }
    </script>
</body>
</html>
